version: "3.9"

services:
  # ─── Application Database ────────────────────────────────────────────────
  app-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zentrix_db
      POSTGRES_USER: zentrix
      POSTGRES_PASSWORD: zentrix_dev_password
    ports:
      - "5432:5432"
    volumes:
      - app-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zentrix -d zentrix_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Isolated database used only by the Database Fault Laboratory.
  fault-lab-db:
    build:
      context: .
      dockerfile: infra/docker/fault-lab.Dockerfile
    environment:
      POSTGRES_DB: fault_lab
      POSTGRES_USER: fault_lab
      POSTGRES_PASSWORD: fault_lab_dev_password
    ports:
      - "5433:5432"
    volumes:
      - fault-lab-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fault_lab -d fault_lab"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Backend API ─────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      app-db:
        condition: service_healthy

  # ─── Workers ─────────────────────────────────────────────────────────────
  telemetry-collector:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    command: ["python", "-m", "app.workers.telemetry_collector"]
    env_file:
      - .env
    depends_on:
      app-db:
        condition: service_healthy

  retrain-worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    command: ["python", "-m", "app.workers.retrain_worker"]
    env_file:
      - .env
    depends_on:
      app-db:
        condition: service_healthy

  canary-monitor:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    command: ["python", "-m", "app.workers.canary_monitor"]
    env_file:
      - .env
    depends_on:
      app-db:
        condition: service_healthy

  shadow-lab-worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    command: ["python", "-m", "app.workers.shadow_lab_worker"]
    env_file:
      - .env
    depends_on:
      app-db:
        condition: service_healthy

  # ─── MLflow Tracking Server ──────────────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.0
    ports:
      - "5000:5000"
    env_file:
      - infra/monitoring/mlflow.env
    volumes:
      - mlflow-artifacts:/mlflow/artifacts

  # ─── Frontend ────────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - backend

volumes:
  app-db-data:
  fault-lab-data:
  mlflow-artifacts:
